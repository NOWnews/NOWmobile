<div class="video-block">
    <div class="mui-container-fluid">
        <div class="mui-row">
            <a href="/video/{{ video.nodeId }}">
                <div class="circle"></div>
                <i class="fa fa-5x fa-play" aria-hidden="true"></i>
                <img class="video-main-image" src="{{ video.youtubeThumbnail}}">
                <div class="video-info">
                    <p class="category-title">
                        {% if video.category == null %}不分類{% endif %}{{ video.category }}
                    </p>
                    <p style="white-space:nowrap;">{{ video.title }}</p>
                    <p class="text-gray">{{ video.createdAt }}</p>
                </div>
            </a>
        </div>
    </div>
</div>
