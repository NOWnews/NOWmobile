<div class="left-cover"></div>
<div class="right-cover fa-rotate-180"></div>
<ul>
    {% if categoryType == 'news' %}
        <li class="{{ 'isActive' if specialType == 'headline' else '' }}">
            <a data-on='click' data-event-category='m-common' data-event-action='nav' href="/?from=mnav">
                <span>頭條</span>
            </a>
        </li>
        <li class="{{ 'isActive' if specialType == 'subweb' else '' }}">
            <a data-on='click' data-event-category='m-common' data-event-action='nav' href="/subweb?from=mnav">

                <span>精選</span>
            </a>
        </li>
    {% endif %}
    {% for category in mainCategory %}

        {% if category.isExternal %}
            <li>
                <a data-on='click' data-event-category='m-common' data-event-action='nav'
                    href="{{category.url}}?from=mnav">
                    <span>{{ category.name }}</span>
                </a>
            </li>
        {% else %}
             <li class="{{ 'isActive' if category.categoryName == categoryName or news.MainMenu.sn == category.sn else ''  }}">
                <a data-on='click' data-event-category='m-common' data-event-action='nav'
                    href="/{{categoryType}}/category/{{ category.categoryName }}?from=mnav">
                    <span>{{ category.name }}</span>
                </a>
            </li>
        {% endif %}

    {% endfor %}
</ul>
