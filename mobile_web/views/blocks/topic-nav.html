<div id="topic-nav">
    {% for topic in specialTopics %}
        <a data-on='click' data-event-category='m-topic' data-event-action='nav'
            class="mui--text-subhead" href="{{topic.url}}?from=mtopicnav">
            <div>
                {{ topic.title }}
            </div>
        </a>
    {% endfor %}
</div>
