{# pv api #}

{# 新聞用 pv #}
{% if news %}
    <script type="text/javascript">
        $.post( "http://61.67.121.50:10011/news", {
            title: '{{ news.title }}',
            url: '{{ news.url }}',
            type: 'NEWS',
            platform: 'MOBILE',
            taxId: '{{ news.category._id }}',
            newsCreatedTime: '{{ news.created * 1000 }}'
        }, function( data ) {});
    </script>
{% endif %}
