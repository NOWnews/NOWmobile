<!-- mobile 上線的禮物活動 -->
<div class="main-gift-div">

    <div id="open_gift" class="open-gift-img"><img src="/static/img/gift/gift_icon-02.png" alt="" / style="width:50px">&nbsp;</div>

    <div class="im_main close_gift " id="div_main">
        <div id="close_img" class="close-im close_gift"><a href="javascript:void(0);" title="點擊關閉">&nbsp;</a></div>
        <a href="#" class="im-gift gift-a" title="素材位置">
            <img src="/static/img/gift/now-gift-01.png" height="" width="90%" alt="" />
        </a>
    </div>

</div>

<script>
    $(function() {
        //關閉
        $('.close_gift').bind('click', function() {
            $('.main-gift-div').css("height", "0");
            $('#div_main').hide();
            $('#open_gift').show();
        });
        //開啟
        $('#open_gift').bind('click', function(e) {
            $('.main-gift-div').css("height", "272");
            $('#div_main').show();
            // $('#im_main').addClass('close_im');
            $(this).hide();
        });

    });
</script>
