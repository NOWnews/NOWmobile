<!--for base meta -->
<title>{{ photo.title }} | {{ photo.categories[0].name }} | NOWnews今日新聞</title>
<meta name="description" content="{{ news.summary }}" />
<meta name="keywords" content="{{ news.newsKeywords }}">
<meta name="news_keywords" content="{{ news.newsKeywords }}">

<!-- for facebook use2-->
<meta property="og:url" content="https://www.nownews.com/news/{{news.sn}}">
<meta property="og:title" content="{{ news.title }} | NOWnews今日新聞">
<meta property="og:description" content="{{ news.summary }}">
<meta property="og:image" content="{{ news.MainPhoto.thumbnail }}">
<meta property="og:image" content="{{ news.MainPhoto.url }}">

<!-- for Google plus use -->
<meta itemprop="url" content="https://www.nownews.com/news/{{news.sn}}">
<meta itemprop="name" content="{{ photo.title }} | NOWnews今日新聞">
<meta itemprop="description" content="{{ photo.jsonld.description }}">
<meta itemprop="image" content="{{ photo.mainImage }}">
<meta itemprop="keywords" content="">
<meta itemprop="articleSection" content="{{ news.MainMenu.name }}">
<meta itemprop="dateCreated" content="{{ news.createdAt }}">
<meta itemprop="dateModified" content="{{ news.updatedAt }}">
<meta itemprop="datePublished" content="{{ news.createdAt }}">
<link rel="canonical" href="https://www.nownews.com{{news.parseUrl}}">
