<!--for base meta -->
<title>{{ news.title }} | {{ news.MainMenu.name }} | NOWnews今日新聞</title>
<meta name="description" content="{{ news.summary }}" />
<meta name="keywords" content="{{ news.keywords }}">

<!-- for facebook use2-->
<meta property="og:url" content="https://m.nownews.com/news/{{news.sn}}">
<meta property="og:title" content="{{ news.title }}">
<meta property="og:description" content="{{ news.summary }}">
{% if news.MainPhoto.thumbnail %}
<meta property="og:image" content="{{ news.MainPhoto.thumbnail }}">
{% else %}
<meta property="og:image" content="{{ news.MainPhoto.url }}">
{% endif %}
<meta property="og:image" content="{{ news.MainPhoto.url }}">
<meta property="article:author" content="https://www.facebook.com/nownews">

<!-- for Google plus use -->
<meta itemscope itemprop="mainEntityOfPage"  itemType="https://schema.org/WebPage" />
<meta itemprop="url" content="{{ news.jsonld.mainEntityOfPage.id }}">
<meta itemprop="name" content="{{ news.title }}">
<meta itemprop="description" content="{{ news.summary }}">
<div class="mui--hide" itemprop="image" itemscope itemtype="https://schema.org/ImageObject">
    <img src="{{news.MainPhoto.url}}}"/>
    <meta itemprop="url" content="{{news.MainPhoto.url}}">
    <meta itemprop="width" content="696">
    <meta itemprop="height" content="530">
</div>
<meta itemprop="keywords" content="{{ news.keywords }}">
 <div class="mui--hide" itemprop="publisher" itemscope itemtype="https://schema.org/Organization">
    <div itemprop="logo" itemscope itemtype="https://schema.org/ImageObject">
      <img src="https://m.nownews.com/static/img/mobile-logo.png"/>
      <meta itemprop="url" content="https://m.nownews.com/static/img/mobile-logo.png">
      <meta itemprop="width" content="220">
      <meta itemprop="height" content="52">
    </div>
    <meta itemprop="name" content="NOWnews今日新聞">
</div>
<meta itemprop="articleSection" content="{{ news.MainMenu.name }}">
<meta itemprop="dateCreated" content="{{ news.createdAt }}">
<meta itemprop="dateModified" content="{{ news.updatedAt }}">
<meta itemprop="datePublished" content="{{ news.createdAt }}">
<link rel="canonical" href="http://www.nownews.com{{news.parseUrl}}">
