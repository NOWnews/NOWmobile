{# 組成 JSON_LD 資料 #}

{# 首頁 #}
{% if homeJsonLd %}
<script type="application/ld+json">
        {{ homeJsonLd | safe}}
</script>
{% endif %}


{# 新聞頁 #}
{% if news and news.jsonld %}
    <script type="application/ld+json">
       {{ news.jsonld | safe }}
    </script>
{% endif %}

{# 分類頁 #}
{% if catJsonLd %}
    <script type="application/ld+json">
        {{ catJsonLd | safe}}
    </script>
{% endif %}
