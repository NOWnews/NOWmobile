{# 組成 JSON_LD 資料 #}

{# 首頁 #}
{% if homeJsonLd %}
<script type="application/ld+json">
        {% for j in homeJsonLd %}
        {{j | safe}}
        {% endfor %}
    </script>
{% endif %}


{# 新聞頁 #}
{% if news and news.jsonld %}
    <script type="application/ld+json">
        {% for j in news.jsonld %}
        {{j | safe}}
        {% endfor %}
    </script>
{% endif %}
