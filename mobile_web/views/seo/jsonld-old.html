{# 組成 JSON_LD 資料 #}

{# 首頁用 #}

{% if not news %}
    <script type="application/ld+json" data-reactid="63">
        [{
            "@context": "http://schema.org",
            "@type": "WebSite",
            "name": "NOWnews今日新聞",
            "alternateName": ["NOWnews今日新聞", "NOWnews"],
            "url": "https://www.nownews.com",
            "keywords": ["NOWnews", "NOWnews今日新聞"],
            "potentialAction": {
                "@type": "SearchAction",
                "target": "https://www.nownews.com/search?keyword={search_term_string}&timeRange=lastWeek&page=1",
                "query-input": "required name=search_term_string"
            }
        }, {
            "@context": "http://schema.org",
            "@id": "https://www.nownews.com",
            "@type": "Organization",
            "name": "NOWnews今日新聞",
            "url": "https://www.nownews.com/",
            "logo": "https://www.nownews.com/logo.png",
            "contactPoint": [{
                "@type": "ContactPoint",
                "telephone": "+886-2-87978775",
                "contactType": "customer service",
                "areaServed": ["TW"]
            }],
            "sameAs": ["https://zh.wikipedia.org/zh-tw/NOWnews_%E4%BB%8A%E6%97%A5%E6%96%B0%E8%81%9E",
                "https://www.youtube.com/user/NOWnewscom", "https://www.facebook.com/nownews",
                "https://www.instagram.com/nownews/", "http://weibo.com/nownews", "https://twitter.com/NOWnews_TW"
            ]
        }, {
            "@context": "http://schema.org",
            "@type": "BreadcrumbList",
            "itemListElement": [{
                "@type": "ListItem",
                "position": 1,
                "item": {
                    "@id": "https://www.nownews.com",
                    "name": "NOWnews今日新聞"
                }
            }]
        }]
    </script>
{% endif %}

{# 新聞用 JSON-LD #}
{% if news and news.jsonld %}
    <script type="application/ld+json">
    {
        "@context": "{{ news.jsonld.context }}",
        "@type": "{{ news.jsonld.type }}",
        "datePublished": "{{ news.jsonld.datePublished }}",
        "dateModified": "{{ news.jsonld.dateModified }}",
        "mainEntityOfPage": {
            "@type": "{{ news.jsonld.mainEntityOfPage.type }}",
            "@id": "{{ news.jsonld.mainEntityOfPage.id }}"
        },
        "articleBody": "{{ news.jsonld.articleBody }}",
        "headline": "{{ news.jsonld.headline }}",
        "image": {
            "@type": "{{ news.jsonld.image.type }}",
            "url": "{{ news.jsonld.image.url }}",
            "width": "{{ news.jsonld.image.width }}",
            "height": "{{ news.jsonld.image.height }}"
        },
        "author": {
            "@type": "{{ news.jsonld.author.type }}",
            "name": "{{ news.jsonld.author.name }}"
        },
        "publisher": {
            "@type": "{{ news.jsonld.publisher.type }}",
            "name": "{{ news.jsonld.publisher.name }}",
            "logo": {
                "@type": "{{ news.jsonld.publisher.logo.type }}",
                "url": "{{ news.jsonld.publisher.logo.url }}",
                "width": "{{ news.jsonld.publisher.logo.width }}",
                "height": "{{ news.jsonld.publisher.logo.height }}"
            }
        },
        "description": "{{ news.jsonld.description }}"
    }
    </script>
{% endif %}
